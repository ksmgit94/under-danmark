<!doctype html>

  <head>

    <meta name="robots" content="noindex, nofollow" />
    <title>Under Danmark</title>
    <meta name="description" content="Et 3D-kort over dansk jord: hvad den består af, hvad der lever i den, og hvad det liv gør for os." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/main-8OGMD2Oa.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/tekst-CSPZFQnn.js">
    <link rel="stylesheet" crossorigin href="./assets/main-BMoI8sbi.css">
  </head>
  <body>
    <div id="map"></div>
    <img id="flat-map" alt="" src="data/overview.webp" hidden />
    <div id="dim" aria-hidden="true"></div>
    <canvas id="column" aria-hidden="true"></canvas>
    <div id="slab-labels" aria-hidden="true"></div>
    <svg id="chip-lines" aria-hidden="true"></svg>
    <div id="chips"></div>
    <div id="tip" hidden></div>

    <header id="brand">
      <a href="index.html" id="brand-name"></a>
      <div id="brand-actions">
        <a href="methods.html" id="kilder"></a>
        <button id="skip" type="button"></button>
      </div>
    </header>
    <nav id="trail" hidden></nav>
    <nav id="rail" hidden></nav>
    <div id="stepper" hidden></div>

    <main id="story"></main>

    <nav id="tools" hidden>
      <form id="search-form" role="search">
        <label for="search" id="search-label"></label>
        <input id="search" list="places" autocomplete="off" />
        <datalist id="places"></datalist>
      </form>
      <fieldset id="layer-list">
        <legend id="layer-legend"></legend>
      </fieldset>
      <button id="replay" type="button"></button>
    </nav>

    <section id="legend" aria-live="polite" hidden></section>
    <p id="hint" hidden></p>
    <aside id="panel" aria-live="polite" hidden></aside>
  </body>
